<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3E6B40"/>
      <stop offset="100%" stop-color="#2C4E2E"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F3EC"/>
      <stop offset="100%" stop-color="#E9E1D3"/>
    </linearGradient>
    <linearGradient id="leafTip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A9764F"/>
      <stop offset="100%" stop-color="#7A5236"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- App icon rounded square -->
  <rect x="60" y="40" width="280" height="280" rx="64" fill="url(#bgGrad)" filter="url(#softShadow)"/>

  <!-- Checkmark, own stroke thick and confident -->
  <path d="M130 195 L182 247 L275 130"
        fill="none"
        stroke="url(#checkGrad)"
        stroke-width="26"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Small leaf accent growing off the tip of the checkmark, nodding to "growth" -->
  <path d="M275 130 C292 108, 320 104, 336 116 C324 134, 296 140, 275 130 Z"
        fill="url(#leafTip)"/>
  <path d="M280 122 C292 112, 310 108, 322 113" stroke="#5C3E28" stroke-width="2.5" fill="none" opacity="0.55" stroke-linecap="round"/>

  <!-- Wordmark -->
  <text x="200" y="365" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="38" fill="#2C4E2E" letter-spacing="0.5">Task Manager</text>
</svg>
